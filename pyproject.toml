[project]
name = "holystone"
version = "0.1.0"
description = "Scour RP chat logs into clean, condensed, searchable transcripts using free-tier models for the unskilled labor."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
holystone = "holystone.cli:main"
holystone-mcp = "holystone.mcp_server:main"

[tool.setuptools]
packages = ["holystone"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
